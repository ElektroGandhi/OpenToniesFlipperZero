name: Web-Demo

on:
  push:
    branches: [main]
    paths: ["web/**", "docs/media/figuren/**", "tools/demo_bibliothek.py", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.pages.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - run: python3 -m pip install --quiet pillow
      - name: Seite bauen
        run: |
          mkdir site
          cp -r web/font web/index.html web/index2.html web/icon-*.png web/manifest*.webmanifest web/opentonies_bridge.js site/
          python3 tools/demo_bibliothek.py --web site
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: pages
        uses: actions/deploy-pages@v5
