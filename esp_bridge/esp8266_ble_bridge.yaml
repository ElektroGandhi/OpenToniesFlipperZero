# ESP8266 BLE-to-HTTP Bridge für OpenTonies
# Diese Konfiguration ermöglicht iOS-Geräten (die kein WebBluetooth unterstützen)
# die OpenTonies Web-App zu nutzen, indem der ESP8266 als Vermittler fungiert.
#
# Kommunikation:
#   - ESP8266 <=> Flipper Zero: BLE (Serial Profile)
#   - ESP8266 <=> Web-App: HTTP/REST
#
# Vorraussetzungen:
#   - ESP8266 mit ESPHome (über Home Assistant oder standalone)
#   - Flipper Zero mit OpenTonies App (BLE Serial Profile aktiviert)
#
# Anleitung:
#   1. Diese Datei nach Home Assistant esp8266/ Ordner kopieren
#   2. In Home Assistant: Integration -> ESPHome -> Konfiguration hochladen
#   3. ESP8266 flashen und mit Strom versorgen
#   4. In OpenTonies Web-App: Verbindung zu ESP-Bridge statt direktem BLE

substitutions:
  device_name: "opentonies-bridge"
  friendly_name: "OpenTonies Bridge"
  project_name: "OpenTonies.BLE-Bridge"
  project_version: "1.0.0"

esphome:
  name: ${device_name}
  platform: ESP8266
  board: nodemcuv2
  includes:
    - ble_bridge.h

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  
  # Fallback Hotspot falls WLAN nicht verfügbar
  ap:
    ssid: "${device_name} Fallback"
    password: !secret wifi_ap_password

# Enable logging
logger:
  level: INFO
  baud_rate: 0  # Use USB for logging only, serial is used for Flipper

# Enable Home Assistant API
api:
  password: !secret api_password

ota:
  password: !secret ota_password

# Webserver für HTTP-API
web_server:
  port: 80
  # CORS für Web-App
  include_internal: true

# BLE Client - verbindet mit Flipper Zero Serial Profile
ble_client:
  - mac_address: "A4:CF:12:XX:XX:XX"  # Flipper Zero BLE MAC (ermitteln mit: bleak --scan)
    # Flipper Zero verwendet das Serial Profile (NORDIC_SPP)
    # UUIDs für Flipper Serial Service:
    service_uuid: "0000180d-0000-1000-8000-00805f9b34fb"  # Nordic Serial Service
    # Characteristics:
    #   - RX: 00002012-... (write) - Befehle an Flipper senden
    #   - TX: 00002013-... (notify) - Antworten von Flipper empfangen
    rx_char_uuid: "00002012-0000-1000-8000-00805f9b34fb"
    tx_char_uuid: "00002013-0000-1000-8000-00805f9b34fb"
    on_notify:
      - lambda: |-
          // Empfangene Daten von Flipper in HTTP-Antwort umwandeln
          // und für Web-App verfügbar machen
          id(flipper_response) = x;
          ESP_LOGI("BLE", "Received from Flipper: %s", x.c_str());

# HTTP-Server Endpunkte für Web-App
http_request:
  # PING - Testverbindung
  - url: "/ping"
    method: GET
    then:
      - lambda: |-
          id(flipper_response) = "PONG";
          auto response = id(web_server).create_response(200, "text/plain");
          response->send("PONG");

  # Senden eines Befehls an Flipper
  - url: "/ble/send"
    method: POST
    then:
      - lambda: |-
          auto body = request->get_body();
          ESP_LOGI("HTTP", "Command received: %s", body.c_str());
          
          // Befehl an Flipper senden
          id(ble_client_0).write_value(body);
          
          // Warten auf Antwort
          auto response = id(web_server).create_response(200, "application/json");
          response->send("{\"status\":\"sent\",\"command\":" + body + "}");

  # Letzte Flipper-Antwort abrufen
  - url: "/ble/response"
    method: GET
    then:
      - lambda: |-
          auto response = id(web_server).create_response(200, "application/json");
          response->send("{\"response\":" + id(flipper_response) + "}");

  # Status der Verbindung
  - url: "/ble/status"
    method: GET
    then:
      - lambda: |-
          std::string status = id(ble_client_0).is_connected() ? "connected" : "disconnected";
          auto response = id(web_server).create_response(200, "application/json");
          response->send("{\"ble_status\":\"" + status + "\"}");

# Globale Variable für Flipper-Antwort
text_sensor:
  - platform: template
    name: "Flipper Response"
    id: flipper_response
    initial_value: ""

# Status-LEDs
status_led:
  pin:
    number: GPIO2  # D4 auf NodeMCU
    inverted: true

# Den ESP als "OpenTonies Bridge" identifizierbar machen
# MDNS für lokale Entdeckung
mdns:
  hostname: ${device_name}

# mDNS Service für Web-App
mdns_service:
  service: "_opentonies-bridge"
  protocol: "_tcp"
  port: 80
  txt:
    - "device=${device_name}"
    - "type=ble_bridge"

# Sensor für BLE-Verbindungsstatus
binary_sensor:
  - platform: template
    name: "Flipper Connected"
    id: flipper_connected
    device_class: connectivity
    lambda: |-
      return id(ble_client_0).is_connected();
    on_press:
      then:
        - logger.log: "Flipper verbunden!"
    on_release:
      then:
        - logger.log: "Flipper getrennt"

# Auto-Discovery für Home Assistant
# Das Gerät erscheint automatisch in Home Assistant
# und kann dann über die Web-App genutzt werden

# Für Debugging: BLE Scan über API
# GET /ble/scan - listet verfügbare BLE-Geräte auf
# GET /ble/connect?mac=XX:XX:XX:XX:XX:XX - verbindet mit Flipper
# GET /ble/disconnect - trennt Verbindung
