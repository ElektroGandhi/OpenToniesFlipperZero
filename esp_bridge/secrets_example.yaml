# ESPHome Secrets für OpenTonies BLE Bridge
# Kopiere diese Datei nach ~/homeassistant/esphome/secrets.yaml
# und passe die Werte an!

# WLAN-Zugangsdaten
wifi_ssid: "DEIN_WLAN_NAME"
wifi_password: "DEIN_WLAN_PASSWORT"

# Fallback Access Point (falls WLAN nicht verfügbar)
wifi_ap_password: "opentonies_fallback"

# Home Assistant API (optional)
api_password: "dein_home_assistant_api_password"

# OTA Update Password (optional)
ota_password: "dein_ota_password"

# Flipper Zero BLE MAC-Adresse (ermitteln mit: bleak --scan)
flipper_mac: "A4:CF:12:XX:XX:XX"
